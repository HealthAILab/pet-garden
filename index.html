<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>萌宠乐园</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="brand">🏡 萌宠乐园</span><small>陪伴萌宠快乐成长</small></div><div><button id="soundBtn">🔊</button><button id="settingsBtn">⚙️</button></div></header>
<main><aside class="panel"><div class="title"><h2>家庭成员</h2><button id="addMemberBtn">＋ 添加</button></div><div id="memberList"></div><div class="tip"><b>家庭小约定</b><p>完成家务获得爱心，照顾宠物会消耗爱心。全家的每一份努力，都在帮助它长大。</p></div></aside>
<section class="garden"><div class="pet-title"><b id="petName"></b><button id="renamePetBtn">✎</button><span id="levelBadge"></span></div><div class="xp"><span>成长值</span><i><em id="xpBar"></em></i><b id="xpText"></b></div><div class="stage"><div id="petSpeech">今天也要一起加油呀！</div><img id="petImage" alt="家庭宠物"><div>🌷　🌿　🌼　🌱　🌻</div></div><div class="stats"><div>🍎 饱食<i><em id="hungerBar"></em></i><b id="hungerText"></b></div><div>😊 心情<i><em id="moodBar"></em></i><b id="moodText"></b></div><div>✨ 清洁<i><em id="cleanBar"></em></i><b id="cleanText"></b></div><div>🌙 精力<i><em id="energyBar"></em></i><b id="energyText"></b></div></div><div class="care"><button data-action="feed">🍎<b>喂食</b><small>−2 爱心</small></button><button data-action="play">🎾<b>玩耍</b><small>−2 爱心</small></button><button data-action="clean">🫧<b>清洁</b><small>−1 爱心</small></button><button data-action="rest">🌙<b>休息</b><small>免费</small></button></div></section>
<aside class="panel"><div class="title"><h2>今日家庭任务</h2><button id="addTaskBtn">＋ 新任务</button></div><small id="todayText"></small><div id="taskList"></div><div class="offline-reward"><div><b>线下任务加分</b><small id="offlineToday">今天已确认 0 项</small></div><button id="offlineRewardBtn">家长确认 ＋2</button></div><div class="total"><span>今日全家收获</span><b id="todayPoints"></b></div><div class="unlock">🎁 下一级解锁<b id="nextUnlock"></b><small id="nextHint"></small></div></aside></main>
<footer>数据只保存在这台电脑的浏览器中 · <button id="quickExport">导出备份</button></footer>
<dialog id="memberDialog"><form method="dialog"><h3>添加家庭成员</h3><label>名字<input id="memberName" maxlength="8" placeholder="例如：奶奶"></label><label>头像颜色<select id="memberEmoji"><option value="mint">薄荷绿</option><option value="sky">天空蓝</option><option value="peach">蜜桃橙</option><option value="lavender">薰衣紫</option><option value="sun">暖阳黄</option></select></label><div><button value="cancel">取消</button><button id="saveMember" value="default" class="primary">添加</button></div></form></dialog>
<dialog id="taskDialog"><form method="dialog"><h3>添加家庭任务</h3><label>任务<input id="taskTitle" maxlength="20" placeholder="例如：整理书桌"></label><label>分配给<select id="taskMember"></select></label><label>奖励爱心<input id="taskReward" type="number" min="1" max="20" value="5"></label><div><button value="cancel">取消</button><button id="saveTask" value="default" class="primary">添加</button></div></form></dialog>
<dialog id="settingsDialog" class="wide"><form method="dialog"><h3>宠物与数据</h3><label>选择宠物<select id="petSelect"></select></label><div id="petPreview"></div><p class="notice">安装包图片仅用于你的本机家庭场景；对外发布前请取得素材权利人的许可。</p><section><button id="exportBtn" type="button">导出数据</button><label class="file">导入数据<input id="importFile" type="file" accept="application/json"></label><button id="resetBtn" type="button" class="danger">恢复初始数据</button></section><div><button value="default" class="primary">完成</button></div></form></dialog>
<dialog id="offlineRewardDialog"><form method="dialog"><h3>家长确认线下任务</h3><p class="notice">每完成1项增加2爱心和2成长值，可以分多次确认。</p><label>本次完成数量<span class="offline-stepper"><button id="offlineMinus" type="button" aria-label="减少1项">－</button><input id="offlineCount" type="number" min="1" max="99" value="1"><button id="offlinePlus" type="button" aria-label="增加1项">＋</button></span></label><label>任务说明（选填）<input id="offlineNote" maxlength="30" placeholder="例如：整理书桌"></label><label>家长确认码<input id="offlinePin" type="password" inputmode="numeric" maxlength="4" placeholder="请输入4位确认码"></label><p class="offline-calc">本次增加 <b id="offlineRewardAmount">2</b> 爱心和 <b id="offlineGrowthAmount">2</b> 成长值</p><div><button value="cancel">取消</button><button id="confirmOfflineReward" type="button" class="primary">确认增加</button></div></form></dialog><div id="toast"></div><script src="app.js"></script><script src="offline-reward.js"></script></body></html>
